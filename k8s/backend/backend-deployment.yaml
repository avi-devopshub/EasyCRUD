apiVersion: apps/v1 
kind: Deployment
metadata: 
  name: backend-deployment 
  labels: 
    app: backend 

spec: 
  replicas: 3
  strategy:
    type: RollingUpdate 
    rollingUpdate: 
      maxSurge: 1 
      maxUnavailable: 0
  selector: 
    matchLabels: 
      app: backend
  template: 
    metadata: 
      labels: 
        app: backend
    spec: 
      containers: 
        - name: backend-container
          image: 554663574879.dkr.ecr.ap-south-2.amazonaws.com/easycrud-backend:7
          ports: 
            - containerPort: 8080
        
          resources: 
            requests: 
              cpu: "100m"
              memory: "64Mi"
            limits: 
              cpu: "200m"
              memory: "128Mi"
    
